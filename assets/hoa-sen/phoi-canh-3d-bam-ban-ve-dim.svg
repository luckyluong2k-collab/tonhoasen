<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1748 900" role="img" aria-labelledby="title desc">
  <title id="title">Phối cảnh 3D Hoa Sen Home Phủ Lý có kích thước đối chiếu</title>
  <desc id="desc">Phối cảnh 3D có chú thích mặt tiền khoảng 30.089 mm, canopy 7.000 mm, cao đỉnh +10.800 m, fascia bảng hiệu 5.000 mm, cửa bên hông 900 x 2.200 mm và bồn hoa 3.000 mm.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e7a931"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#071a31" flood-opacity=".55"/>
    </filter>
    <style>
      .dim { stroke:#e7a931; stroke-width:3; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
      .leader { stroke:#f4c35f; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .tick { stroke:#f4c35f; stroke-width:2; }
      .label { font-family:Arial, Helvetica, sans-serif; font-size:22px; font-weight:800; fill:#fff; letter-spacing:.2px; }
      .small { font-family:Arial, Helvetica, sans-serif; font-size:17px; font-weight:700; fill:#fff; }
      .box { fill:#071a31e8; stroke:#f4c35f; stroke-width:1.5; rx:8; }
      .tag { fill:#e7a931; stroke:#071a31; stroke-width:2; }
      .tagtext { font-family:Arial, Helvetica, sans-serif; font-size:18px; font-weight:900; fill:#071a31; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <image x="0" y="0" width="1748" height="900" preserveAspectRatio="none" xlink:href="./phoi-canh-3d-bam-ban-ve-v2.png"/>
  <rect x="22" y="20" width="520" height="54" class="box" filter="url(#shadow)"/>
  <text x="42" y="54" class="label">PHỐI CẢNH 3D · DIM ĐỐI CHIẾU HỒ SƠ KT</text>

  <!-- Overall frontage -->
  <line x1="338" y1="96" x2="1632" y2="96" class="dim"/>
  <line x1="338" y1="103" x2="338" y2="135" class="tick"/>
  <line x1="1632" y1="103" x2="1632" y2="135" class="tick"/>
  <rect x="760" y="106" width="450" height="42" class="box"/>
  <text x="985" y="134" class="label" text-anchor="middle">MẶT TIỀN ≈ 30.089 mm</text>

  <!-- Overall height / sign band -->
  <line x1="294" y1="82" x2="294" y2="359" class="dim"/>
  <line x1="303" y1="82" x2="338" y2="82" class="tick"/>
  <line x1="303" y1="359" x2="338" y2="359" class="tick"/>
  <rect x="38" y="180" width="238" height="72" class="box"/>
  <text x="157" y="209" class="label" text-anchor="middle">FASCIA 5.000 mm</text>
  <text x="157" y="235" class="small" text-anchor="middle">từ +5.000 đến +10.800</text>
  <line x1="276" y1="214" x2="293" y2="214" class="leader"/>
  <rect x="66" y="286" width="185" height="42" class="box"/>
  <text x="158" y="314" class="label" text-anchor="middle">ĐỈNH +10.800 m</text>
  <line x1="251" y1="306" x2="294" y2="102" class="leader"/>

  <!-- Three canopy columns -->
  <circle cx="408" cy="400" r="19" class="tag"/><text x="408" y="400" class="tagtext">1</text>
  <circle cx="1013" cy="453" r="19" class="tag"/><text x="1013" y="453" class="tagtext">2</text>
  <circle cx="1584" cy="454" r="19" class="tag"/><text x="1584" y="454" class="tagtext">3</text>
  <rect x="1195" y="528" width="318" height="44" class="box"/>
  <text x="1354" y="557" class="label" text-anchor="middle">03 CỘT CANOPY · ALU BẠC</text>
  <line x1="1195" y1="550" x2="1018" y2="466" class="leader"/>

  <!-- Canopy projection -->
  <rect x="1250" y="686" width="400" height="70" class="box"/>
  <text x="1450" y="716" class="label" text-anchor="middle">CANOPY VƯƠN 7.000 mm</text>
  <text x="1450" y="741" class="small" text-anchor="middle">mái dốc nhẹ theo mặt cắt</text>
  <line x1="1250" y1="714" x2="1517" y2="475" class="leader"/>

  <!-- Side pedestrian door -->
  <rect x="22" y="626" width="365" height="74" class="box"/>
  <text x="204" y="656" class="label" text-anchor="middle">CỬA NHỎ BÊN HÔNG · D2</text>
  <text x="204" y="682" class="small" text-anchor="middle">900 × 2.200 mm</text>
  <line x1="387" y1="657" x2="250" y2="585" class="leader"/>

  <!-- Planter -->
  <rect x="90" y="790" width="280" height="62" class="box"/>
  <text x="230" y="817" class="label" text-anchor="middle">BỒN HOA B1/B2</text>
  <text x="230" y="841" class="small" text-anchor="middle">dài 3.000 mm · bo đầu</text>
  <line x1="370" y1="810" x2="440" y2="738" class="leader"/>
</svg>
