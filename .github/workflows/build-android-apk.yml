name: Build Hoa Sen Home APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.3
      - name: Install Capacitor dependencies
        run: npm ci
      - name: Generate Android project
        run: npx cap add android
      - name: Apply HSH app logo
        run: >-
          npx @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor "#8f1826" --iconBackgroundColorDark "#8f1826"
          --splashBackgroundColor "#8f1826" --splashBackgroundColorDark "#8f1826"
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hoa-sen-home-phu-ly-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
